<main class="articles-page-shell article-container pb-24 sm:pb-8">
  <div class="articles-card-wrap">
    <!-- Header Card -->
    <article class="articles-header-card">
      <header class="articles-header">
        <h1 class="articles-title">บทความสาระน่ารู้</h1>
        <p class="articles-description">
          รวมบทความ แนะนำเทคนิค วิธีติดตั้งแพตช์แปลภาษา และเรื่องราวน่าสนใจในวงการเกมแปลไทย
        </p>
      </header>
    </article>

    <!-- Loading State -->
    <article *ngIf="loading" class="articles-status-card">
      <p class="status-text">กำลังโหลดบทความ...</p>
    </article>

    <!-- Articles Stack -->
    <section *ngIf="!loading && articles.length" class="articles-cards-stack" aria-label="รายการบทความทั้งหมด">
      <article *ngFor="let article of articles" class="public-article-card">
        <a class="article-link-wrap" [routerLink]="['/article', article.slug]">
          <div *ngIf="article.coverUrl" class="article-cover-wrap">
            <img class="article-cover-img" [src]="article.coverUrl" [alt]="article.title" loading="lazy" />
          </div>
          <div class="article-info">
            <div class="article-tags-row">
              <span *ngIf="article.category" class="category-tag">{{ article.category }}</span>
              <span *ngIf="article.publishedAt" class="date-tag">{{ article.publishedAt | date:'d MMM yyyy' }}</span>
            </div>
            <h2 class="article-title">{{ article.title }}</h2>
            <p *ngIf="article.excerpt" class="article-excerpt">{{ article.excerpt }}</p>
            <span class="read-more-link">
              อ่านบทความ <i class="fa-solid fa-arrow-right ml-1" aria-hidden="true"></i>
            </span>
          </div>
        </a>
      </article>
    </section>

    <!-- Empty State -->
    <article *ngIf="!loading && !articles.length" class="articles-status-card">
      <p class="status-text">ยังไม่มีบทความในขณะนี้</p>
    </article>
  </div>
</main>
