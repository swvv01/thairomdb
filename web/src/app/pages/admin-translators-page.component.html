<app-admin-master-page [items]="(items | async) ?? []" title="จัดการ master ทีมแปล" addLabel="เพิ่มทีมแปล" emptyText="ยังไม่มีข้อมูลทีมแปล" [dialogOpen]="open" [dialogTitle]="id ? 'แก้ไขทีมแปล' : 'เพิ่มทีมแปล'" [saving]="saving" (create)="add()" (edit)="edit($event)" (remove)="remove($event)" (save)="save()" (close)="close()" (signOut)="signOut()">
  <ng-template #card let-item><h2 class=" text-lg">{{ item.shortName }} - {{ item.name }}</h2></ng-template>
  <ng-template #editor><label class="mt-4 block">ชื่อย่อ<input class="admin-input" [(ngModel)]="shortName" /></label><label class="mt-3 block">ชื่อเต็ม<input class="admin-input" [(ngModel)]="name" /></label><label class="mt-3 block">Mod tool<input class="admin-input" [(ngModel)]="modTool" /></label><label class="mt-3 block">ลิงก์<input class="admin-input" [(ngModel)]="link" type="url" /></label></ng-template>
</app-admin-master-page>
