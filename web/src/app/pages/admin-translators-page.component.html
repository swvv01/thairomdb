<app-admin-master-page
  [items]="(items | async) ?? []"
  title="จัดการ master ทีมแปล"
  addLabel="เพิ่มทีมแปล"
  emptyText="ยังไม่มีข้อมูลทีมแปล"
  [dialogOpen]="open"
  [dialogTitle]="id ? 'แก้ไขทีมแปล' : 'เพิ่มทีมแปล'"
  [saving]="saving || syncingPatchTool"
  (create)="add()"
  (edit)="edit($event)"
  (remove)="remove($event)"
  (save)="save()"
  (close)="close()"
  (signOut)="signOut()">
  <ng-template #card let-item>
    <h2 class="text-lg">{{ item.shortName }} - {{ item.name }}</h2>
  </ng-template>
  <ng-template #editor>
    <label class="mt-4 block">
      ชื่อย่อ
      <input class="admin-input" [(ngModel)]="shortName" />
    </label>
    <label class="mt-3 block">
      ชื่อเต็ม
      <input class="admin-input" [(ngModel)]="name" />
    </label>
    <label class="mt-3 block">
      Mod tool
      <input class="admin-input" [(ngModel)]="modTool" />
    </label>
    @if (id) {
    <div class="mt-2 flex items-center justify-end">
      <button
        class="button border px-3 py-1.5 font-bold text-base"
        type="button"
        [disabled]="saving || syncingPatchTool || !modTool.trim()"
        (click)="syncPatchToolToAllGames()">
        <i class="fa-solid fa-arrows-rotate mr-1" aria-hidden="true"></i>
        {{ syncingPatchTool ? 'กำลังซิงค์…' : 'ซิงค์ Patch Tool ไปยังทุกเกม' }}
      </button>
    </div>
    }
    <label class="mt-3 block">
      ลิงก์
      <input class="admin-input" [(ngModel)]="link" type="url" />
    </label>
  </ng-template>
</app-admin-master-page>
