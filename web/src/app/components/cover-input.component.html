<input #coverFile id="cover-file" class="hidden" type="file" accept="image/*" (change)="select($event)" />

<button class="mr-2 mt-2 px-3 py-2 font-bold transition button" type="button" (click)="searchCoverImage()">
    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
    ค้นหารูปภาพ
</button>
<button class="mr-2 mt-2 px-3 py-2 font-bold transition button" type="button" (click)="readFromClipboard()">
    <i class="fa-regular fa-clipboard" aria-hidden="true"></i>
    Clipboard
</button>
<button class="mr-2 mt-2 px-3 py-2 font-bold transition button" type="button" (click)="coverFile.click()">
    <i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i>
    เลือกไฟล์
</button>

@if (preview()) {
  <div class="cover-preview-wrapper mt-3">
    <img class="cover-preview" [src]="preview()" alt="Cover preview" />
    <div class="cover-actions mt-2 flex flex-wrap gap-2">
      <button class="px-3 py-2 font-bold transition button button--accent" type="button" (click)="openCropper()">
        <i class="fa-solid fa-crop-simple mr-1" aria-hidden="true"></i>
        ครอบตัด
      </button>
      @if (isCropped()) {
        <button class="px-3 py-2 font-bold transition button" type="button" (click)="resetToOriginal()">
          <i class="fa-solid fa-rotate-left mr-1" aria-hidden="true"></i>
          รีเซ็ตรูปต้นฉบับ
        </button>
      }
      <button class="px-3 py-2 font-bold transition button" type="button" (click)="clear()">
        <i class="fa-solid fa-trash mr-1" aria-hidden="true"></i>
        ล้างรูป
      </button>
    </div>
  </div>
}
@if (error()) { <p class="mt-2 text-[var(--color-brand)]" role="alert">{{ error() }}</p> }

@if (cropperOpen() && rawBlob()) {
  <app-image-cropper-modal [imageBlob]="rawBlob()!" (cropped)="onCropped($event)" (cancelled)="closeCropper()" />
}
